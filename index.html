<script type="application/json" id="data">{"name":"Devmani Tripathi","tag":"Founder · Prexus Intelligence","hl":"Writing on AI, risk & building a startup.","bio":"","posts":[{"id":"multidimensional-cognition","c":"Blog","t":"Delusion with Fusion of Multidimensional Cognition Living","d":"2026-10-28T12:00:00.000Z","s":"","b":"I recently realised that a person who can casually enjoy the outdoors, spend an entire week working at a workbench without social engagement, talk naturally in public, crack jokes, and build an air-gapped system with a clear mind should have an advantage in some way.\n\nThat's what I'm calling multidimensional cognition.\n\nI actually experienced this thought more deeply at a fair (mela). It was a strange feeling, something I can't quite put into words or fully explain to you. But perhaps, in certain moments, you might experience something similar yourself.\n\nBUT WHY DID I SAY THAT THIS TYPE OF PERSON SHOULD WIN?\n\nProbably because this is how we can survive almost anything: by developing a mindset that allows us to adapt to different situations without being limited to just one way of living, thinking, or functioning.\n\nA person shouldn't have just one way of living, one game to play, one thought to think, one outfit to wear, or one kind of fun to enjoy.\n\nLife doesn't have to follow a single pattern. We can live a messy life filled with paradoxical activities, explore different interests, and move between completely different experiences while still following an aligned path toward our ambitions.\n\nWe don't have to make every part of our life look the same to keep moving in the same direction.\n\nThere must be nights when we cry and want no one around us. There must be moments when we laugh with our entire circle of friends and play together like there's nothing else in the world to worry about.\n\nWe need room for all these experiences. We can be alone, we can connect with others, we can laugh, and we can break down. None of these experiences should define our entire existence.\n\nThrough all of this, you must remain yourself. You must allow yourself to experience life in its different forms without losing sight of who you are or where you want to go.\n\nYou cannot exclude every possibility of pain from your life, even when you know that pain is, in some ways, a necessary part of living. You don't have to welcome suffering, nor do you have to pretend it doesn't hurt. You simply have to acknowledge it, learn what you can from it, and keep moving forward.","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wgARCAMUBXgDASIAAhEBAxEB/8QAGgAAAwEBAQEAAAAAAAAAAAAAAgMEBQEABv/EABgBAQEBAQEAAAAAAAAAAAAAAAECAAME/9oADAMBAAIQAxAAAAHByNCPh6KtzNfzrvU05+Yt+hzrjYztLE59MX6fDLryqX18U/M0s/PmT+uA2Jyl0MThurgYAq8t1RUm/Q59QXnINrSFPmPRk7cmU9ApJ6Sk6ue+W2KUimvTwqpo1ac9QNuF9PtzyPnc8+kzDh2vcRzr5n2yjpKnFklUAjR68Yy7dNokZFUaiZdCan672NbmZr8r9lXIslGX1xpaGZNFfQLwqdtBLCmkO8ST+plTqzn2n0Tw0IUbXSM/YGqK1flNvJGHVnXRQ3O5tXGYp2idwyr3Jak/rvno5rqUMyTQEw2x92fPRLkO97myOgNL7ZSGtaKZR8uap7O3iCfa3KU6TGYdJVJJ1EzU46cQzsMXLRQc1NzzLjy+r2cXOxaqZEJoZzkOD3Ne4yF6MLladmdL5fG6lNAjdAgQSH23O94gUeZtUAiSiO5zo/D5KELlqdp+GqX6XmNXN/Sry18+k6eP6c6s7SZFYupkaHSAYGft9DnLHF1U6YtlscjtJK3GmdAVzrrxSl2FScy8VT7WhC91lMvOfQ1+DL2S6I5JUyXDac7Qi6ZgSlJQtqKXRrSjW+Z2Zvk2gHPpZkB2p9q4UrOlG9iJM8+p1n/OeqNFc2uVnFH2o2Jx0+XU8y3Mw0+UJIndn2ytHM2ky7LETTDxN3LvYurKhkpbMmBVy1SdJnPLvE0042ltxvos7kWQONbmNW6wp+i1q2TX0A/O72zcNMG2iEKKNd2aQ2dT4a155JV04xt0822KKeflTV6RFTrKy7dqPQJNpDl6FGNqnnVP0FPz3Jq/uG1NySTw9qywqdyfLdLYiKjak4+laSZyiuuEczzl7rzrmcGzQSDOxHPoj6Xz5uYWT7dMmbKAOu6LF7eYcLOlOgKi32eez/D5I+1UF5vtEBh9QNQjr/bVcm9F9awppXH8MgX0OzC0uGyx0/VMbbYRR18tyfPO2mGxmM87ebR9tHM7T5K4FomjS33SLJjdFCxkM2ydVnTnLy/mwzUt2zypzamji78oeuWL1Ah4bRze0pN7XnGIWhc9HvcK6zjgFvcKF7jeqbjxeuuRxurWaA0OJoczRmtH0BOf5MzN6pKHIVtgmXzZ5jI7t8HJZaoqTzeosrKovI try{const t=localStorage.getItem('th');if(t)document.documentElement.dataset.theme=t}catch(e){}
const fd=d=>new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}),rt=b=>Math.max(1,Math.round(b.split(/\s+/).length/200)),slug=t=>(t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'post')+'-'+Math.random().toString(36).slice(2,6);
function md(t){const h=esc(t).split(/\n{2,}/).map(b=>{b=b.trim();let m=b.match(/^(#{1,3}) (.*)/);if(m){const n=m[1].length+1;return`<h${n}>${m[2]}</h${n}>`}if(/^(- .*(\n|$))+$/.test(b))return'<ul>'+b.split('\n').map(l=>'<li>'+l.slice(2)+'</li>').join('')+'</ul>';if(/^&gt; /.test(b))return'<blockquote>'+b.replace(/^&gt; /gm,'')+'</blockquote>';return'<p>'+b.replace(/\n/g,'<br>')+'</p>'}).join('');return h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function toast(m){const e=$('#t');e.textContent=m;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,3200)}
function render(){
$('#app').innerHTML=`<header><div class="w"><span class="logo">${esc(S.name)}</span><button class="b" onclick="th()" aria-label="Toggle theme">◐</button></div></header>
<main class="w">${AD?`<div class="adm"><b>Admin mode · draft</b><br><span class="mut">Changes are saved in this browser only. Download the site and upload it to your host to make them live.</span><div class="row"><button class="b p" onclick="ed()">＋ New post</button><label class="b">⬆ Import .md files<input type="file" accept=".md,.txt,text/*" multiple hidden onchange="imp(this)"></label><button class="b" onclick="prof()">Profile</button><button class="b p" onclick="dl()">⬇ Download site</button><button class="b" onclick="rs(this)">Reset</button></div></div>`:''}
<section class="hero"><div class="tag">${esc(S.tag)}</div><h1>${esc(S.hl)}</h1>${S.bio?`<p>${esc(S.bio)}</p>`:''}<div class="mut">${S.posts.length} post${S.posts.length==1?'':'s'}${(n=>n?` · ${n} news brief${n==1?'':'s'}`:'')(S.posts.filter(p=>p.c=='Business News').length)}</div></section>
<div class="bar">${['All',...CATS].map(c=>`<button class="b${c==cat?' on':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}<input placeholder="Search…" value="${esc(q)}" oninput="q=this.value;lst()"></div><div id="l"></div></main>
<footer class="mut">© ${new Date().getFullYear()} ${esc(S.name)}</footer>`;lst()}
function lst(){const k=q.toLowerCase();$('#l').innerHTML=S.posts.filter(p=>(cat=='All'||p.c==cat)&&(p.t+p.b).toLowerCase().includes(k)).sort((a,b)=>b.d.localeCompare(a.d)).map(p=>`<a class="card" onclick="rd('${p.id}')"><span class="tag">${esc(p.c)}</span><h3>${esc(p.t)}</h3><p>${esc(p.b.replace(/[#*`>\[\]]/g,'').slice(0,140))}…</p><div class="mut">${fd(p.d)} · ${rt(p.b)} min read</div></a>`).join('')||'<p class="mut">Nothing here yet.</p>'}
function rd(id,k){const p=S.posts.find(x=>x.id==id);if(!p)return;if(!AD&&!k)location.hash=id;$('#ov').innerHTML=`<div class="ov"><div class="w art"><div class="top"><button class="b" onclick="cl()">← Back</button><span><button class="b" onclick="cp('${id}')">Copy link</button> ${AD?`<button class="b" onclick="ed('${id}')">Edit</button>`:''}</span></div><div class="tag">${esc(p.c)}</div><h1>${esc(p.t)}</h1><div class="mut">${fd(p.d)} · ${rt(p.b)} min read</div>${p.img?`<img class="cov" src="${esc(p.img)}" alt="${esc(p.ia||'')}">`:''}${md(p.b)}${p.s?`<p class="mut">Source: <a href="${esc(p.s)}" target="_blank" rel="noopener">${esc(p.s)}</a></p>`:''}</div></div>`}
function cl(){$('#ov').innerHTML='';if(!AD&&location.hash)location.hash=''}
async function cp(id){try{await navigator.clipboard.writeText(location.href.split('#')[0]+'#'+id);toast('Link copied')}catch(e){toast('Couldn’t copy the link')}}
function ed(id){const p=S.posts.find(x=>x.id==id)||{c:'Blog',t:'',b:'',s:'',d:new Date().toISOString()};$('#ov').innerHTML=`<div class="ov"><div class="w"><div class="top"><button class="b" onclick="cl()">Cancel</button><button class="b p" onclick="sv('${id||''}')">Save draft</button></div><h2>${id?'Edit post':'New post'}</h2><select class="f" id="ec">${CATS.map(c=>`<option${c==p.c?' selected':''}>${c}</option>`).join('')}</select><input class="f" id="et" placeholder="Title" value="${esc(p.t)}"><input class="f" type="date" id="ed" value="${p.d.slice(0,10)}"><input class="f" id="es" placeholder="Source link (optional, for news)" value="${esc(p.s||'')}"><textarea class="f" id="eb" rows="14" placeholder="Write in Markdown…">${esc(p.b)}</textarea>${id?`<button class="b" onclick="del('${id}',this)">Delete</button>`:''}</div></div>`}
function sv(id){const t=$('#et').value.trim(),b=$('#eb').value.trim();if(!t||!b)return toast('Add a title and some text');let s=$('#es').value.trim();s=/^https?:\/\//.test(s)?s:'';const dv=$('#ed').value,o={t,b,s,c:$('#ec').value,d:dv?new Date(dv+'T12:00:00Z').toISOString():new Date().toISOString()};if(id)Object.assign(S.posts.find(x=>x.id==id),o);else S.posts.push({id:slug(t),...o});cl();keep()}
function del(id,e){if(!del.a){del.a=1;e.textContent='Tap again to confirm';return}S.posts=S.posts.filter(x=>x.id!=id);cl();keep()}
function parse(t,n){const o={c:'Blog',s:'',d:new Date().toISOString()};let m=t.match(/^---\n([\s\S]*?)\n---\n?/);if(m){t=t.slice(m[0].length);m[1].split('\n').forEach(l=>{const k=l.match(/^(\w+):\s*(.*)$/);if(!k)return;const K=k[1].toLowerCase(),v=k[2].replace(/^["']|["']$/g,'');if(K=='title')o.t=v;else if(K=='category'||K=='type')o.c=CATS.find(c=>c.toLowerCase()==v.toLowerCase())||'Blog';else if(K=='date'&&!isNaN(new Date(v)))o.d=new Date(v).toISOString();else if(K=='source'||K=='url')o.s=/^https?:\/\//.test(v)?v:''})}m=t.match(/^# (.+)\n/);if(m){o.t=o.t||m[1];t=t.slice(m[0].length)}o.t=o.t||n.replace(/\.\w+$/,'').replace(/[-_]+/g,' ');o.b=t.trim();return o}
async function imp(i){let n=0;for(const f of i.files){const o=parse((await f.text()).replace(/\r\n?/g,'\n'),f.name);if(!o.b)continue;S.posts.push({id:slug(o.t),...o});n++}i.value='';keep();toast(n+' imported')}
function prof(){$('#ov').innerHTML=`<div class="ov"><div class="w"><div class="top"><button class="b" onclick="cl()">Cancel</button><button class="b p" onclick="sp()">Save draft</button></div><h2>Profile</h2><input class="f" id="pn" placeholder="Name" value="${esc(S.name)}"><input class="f" id="pt" placeholder="Role line" value="${esc(S.tag)}"><input class="f" id="ph" placeholder="Headline" value="${esc(S.hl)}"><textarea class="f" id="pb" rows="6" placeholder="Bio">${esc(S.bio)}</textarea></div></div>`}
function sp(){S.name=$('#pn').value.trim()||S.name;S.tag=$('#pt').value;S.hl=$('#ph').value;S.bio=$('#pb').value;cl();keep()}
function keep(){try{localStorage.setItem('draft',JSON.stringify({v:DV,s:S}))}catch(e){toast('Couldn’t save the draft here — download before closing')}render()}
function rs(e){if(!rs.a){rs.a=1;e.textContent='Tap again: discard draft';return}try{localStorage.removeItem('draft')}catch(x){}location.reload()}
function th(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark';try{localStorage.setItem('th',r.dataset.theme)}catch(e){}}
const build=()=>'<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="'+esc((S.bio||'Writing and business news by '+S.name+'.').slice(0,155))+'"><title>'+esc(S.name)+' — Writing &amp; Business News</title><style id="css">'+$('#css').textContent+'</style></head><body><div id="app"></div><div id="ov"></div><div id="t"></div><script type="application/json" id="data">'+JSON.stringify(S).replace(/</g,'\\u003c')+'<\/script><script id="main">'+$('#main').textContent+'<\/script></body></html>';
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([build()],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();toast('Downloaded index.html — upload it to your host to go live')}
onhashchange=()=>{const h=location.hash.slice(1);h&&h!='admin'?rd(h,1):$('#ov').innerHTML=''};
render();if(!AD&&location.hash.length>1)rd(location.hash.slice(1),1);
</script>
</body></html>
